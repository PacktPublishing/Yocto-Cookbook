header:
  version: 19

distro: nodistro

repos:
  bitbake:
    url: "https://git.openembedded.org/bitbake"
    branch: master
    path: layers/bitbake
    layers:
      .: disabled

  openembedded-core:
    url: "https://git.openembedded.org/openembedded-core"
    branch: master
    path: layers/bitbake
    layers:
      meta:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    SOURCE_MIRROR_URL = "http://downloads.yoctoproject.org/mirror/sources/"
    INHERIT += "report-error"
    BB_NUMBER_THREADS = "4"
    BB_NUMBER_PARSE_THREADS = "4"

  diskmon: |
    BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

  dlsstate: |
    DL_DIR = "/home/yourbuilddir/downloads"
    SSTATE_DIR = "/home/yourbuilddir/sstate-cache"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

